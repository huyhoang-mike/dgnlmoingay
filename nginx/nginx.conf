# ============================================
# ĐGNL Mỗi Ngày - Nginx Reverse Proxy
# Production-ready for Hetzner VPS + Cloudflare
# Domain: dgnlmoingay.edu.vn
# ============================================

# ── Rate Limiting ─────────────────────────────
# Giới hạn 10 req/s per IP cho API (chống brute-force)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# Giới hạn 30 req/s per IP cho static files
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

# ── Upstreams ─────────────────────────────────
upstream frontend_upstream {
    server frontend:80;
}

upstream backend_upstream {
    server backend:8000;
}

# ── Cloudflare Real IP ────────────────────────
# Cloudflare proxy IP ranges (cập nhật tại https://www.cloudflare.com/ips/)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name dgnlmoingay.edu.vn www.dgnlmoingay.edu.vn;

    client_max_body_size 50M;

    # ── Security Headers ──────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── API routes → FastAPI backend ──────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # ── API docs (chỉ hoạt động nếu backend bật) ──
    location /docs {
        proxy_pass http://backend_upstream/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://backend_upstream/openapi.json;
        proxy_set_header Host $host;
    }

    # ── Everything else → React frontend ──────
    location / {
        limit_req zone=general burst=50 nodelay;

        proxy_pass http://frontend_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
