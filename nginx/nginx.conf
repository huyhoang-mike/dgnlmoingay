# ============================================
# ĐGNL Mỗi Ngày - Nginx Reverse Proxy
# Production-ready for Hetzner VPS + Cloudflare
# Domain: dgnlmoingay.com
# ============================================

# ── Rate Limiting ─────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;# Stricter zones for sensitive endpoints (login, payments webhook, admin)
limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=5r/s;
# ── Upstreams ─────────────────────────────────
upstream frontend_upstream {
    server frontend:80;
}

upstream backend_upstream {
    server backend:8000;
}

# ── Cloudflare Real IP ────────────────────────
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

# ══════════════════════════════════════════════
# Server 1: Block truy cập qua IP trực tiếp
# Ai truy cập http://178.104.169.255 → bị từ chối
# ══════════════════════════════════════════════
server {
    listen 80 default_server;
    listen 443 default_server ssl;
    server_name _;

    # Self-signed cert (cần tạo, xem hướng dẫn bên dưới)
    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    return 444;  # Drop connection, không trả gì cả
}

# ══════════════════════════════════════════════
# Server 2: HTTPS — Cloudflare SSL Full
# Cloudflare kết nối tới VPS qua HTTPS (port 443)
# ══════════════════════════════════════════════
server {
    listen 443 ssl;
    http2 on; # Cú pháp mới, thay cho "listen 443 ssl http2"
    server_name dgnlmoingay.com www.dgnlmoingay.com;

    # ── SSL cert (Cloudflare Origin hoặc self-signed) ──
    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # ── Proxy Buffers (fix JS buffered to temp file) ──
    proxy_buffer_size 16k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 512k;

    # ── Gzip Compression (giảm 351KB JS → ~90KB) ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # ── Security Headers ──────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS: force HTTPS for 1 year, include subdomains. Browsers cache this aggressively.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP: limit script/style sources, allow Google OAuth + MathJax + Drive embeds + VietQR.
    # 'unsafe-inline' for styles is required by Tailwind utility classes injected at runtime.
    # If a stricter policy is needed, generate nonces in the SPA shell.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://www.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' https://drive.google.com; frame-src https://accounts.google.com https://drive.google.com https://docs.google.com https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

    # ── Block sensitive files (trả 404, không leak info) ──
    location ~ /\. {
        # Block /.env, /.git/config, /.DS_Store, .vscode, etc.
        deny all;
        return 404;
    }

    # ── API routes → FastAPI backend ──────────
    # Stricter limits on credential/payment endpoints to slow brute force + replay.
    location ~ ^/api/(auth/google|auth/users|payments/orders) {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location ~ ^/api/payments/webhook {
        limit_req zone=webhook burst=10 nodelay;

        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # ── Uploaded files (/uploads) ──
    location /uploads/ {
        limit_req zone=general burst=50 nodelay;

        # Serve directly from shared Docker volume (mounted at /var/www/uploads)
        alias /var/www/uploads/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── API docs (chỉ hoạt động nếu backend bật) ──
    location /docs {
        proxy_pass http://backend_upstream/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://backend_upstream/openapi.json;
        proxy_set_header Host $host;
    }

    # ── SEO: dynamic sitemap + robots from backend ──
    # Includes Q&A pages, open materials, deep-practice quizzes for better indexing.
    location = /sitemap.xml {
        proxy_pass http://backend_upstream/api/seo/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        proxy_pass http://backend_upstream/api/seo/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # ── Everything else → React frontend ──────
    location / {
        limit_req zone=general burst=50 nodelay;

        proxy_pass http://frontend_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ══════════════════════════════════════════════
# Server 3: HTTP → redirect HTTPS
# ══════════════════════════════════════════════
server {
    listen 80;
    server_name dgnlmoingay.com www.dgnlmoingay.com;
    return 301 https://$host$request_uri;
}
