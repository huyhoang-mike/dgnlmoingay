# Frontend container internal nginx (serves built React SPA)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # JSON assets must not fall back to index.html
    # (otherwise fetch(...).json() crashes with "Unexpected token '<'".)
    location ~* \.json$ {
        try_files $uri =404;
    }

    # SPA fallback - send all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
