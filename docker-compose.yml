# ============================================
# ĐGNL Mỗi Ngày - Docker Compose
# Production-ready for Hetzner VPS + Cloudflare
# Domain: dgnlmoingay.com
# ============================================

services:
  # ── PostgreSQL Database ──────────────────────
  db:
    image: postgres:16-alpine
    container_name: dgnl_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"        # ⚠️ Chỉ bật khi dev local cần truy cập DB trực tiếp
    networks:
      - dgnl_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dgnl_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-sepay}
      PAYMENT_ORDER_PREFIX: ${PAYMENT_ORDER_PREFIX:-DGNL}
      PAYMENT_ORDER_EXPIRY_MINUTES: ${PAYMENT_ORDER_EXPIRY_MINUTES:-60}
      COURSE_PRICE_VND: ${COURSE_PRICE_VND:-699000}
      SEPAY_WEBHOOK_HEADER: ${SEPAY_WEBHOOK_HEADER:-x-sepay-token}
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET}
      BANK_NAME: ${BANK_NAME}
      BANK_BIN: ${BANK_BIN}
      BANK_ACCOUNT_NUMBER: ${BANK_ACCOUNT_NUMBER}
      BANK_ACCOUNT_NAME: ${BANK_ACCOUNT_NAME}
      COURSE_ZALO_GROUP_URL: ${COURSE_ZALO_GROUP_URL}
      COURSE_YOUTUBE_GUIDE_URL: ${COURSE_YOUTUBE_GUIDE_URL}
      SUPPORT_ZALO_URL: ${SUPPORT_ZALO_URL}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    # ports:
    #   - "8000:8000"        # ⚠️ Chỉ bật khi dev local cần bypass Nginx
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dgnl_network
    volumes:
      - qa_uploads:/app/uploads
    # volumes:
    #   - ./backend/app:/app/app  # ⚠️ Chỉ bật khi dev local cần hot-reload

  # ── React Frontend ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: dgnl_frontend
    restart: unless-stopped
    networks:
      - dgnl_network
    depends_on:
      - backend

  # ── Nginx Reverse Proxy ─────────────────────
  nginx:
    image: nginx:alpine
    container_name: dgnl_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - qa_uploads:/var/www/uploads:ro
    depends_on:
      - frontend
      - backend
    networks:
      - dgnl_network

# ── Shared Network ─────────────────────────────
networks:
  dgnl_network:
    driver: bridge

# ── Persistent Volumes ─────────────────────────
volumes:
  postgres_data:
  qa_uploads:
